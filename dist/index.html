  <style>

<body>
  <main class="app">
    <nav class="site-nav" aria-label="網站頁面"><a class="active" href="./index.html" aria-current="page">隊伍資料</a><a href="./match.html">對戰模擬</a></nav>
    <header class="topbar"><div><div class="eyebrow"><span class="dot"></span>Team Command</div><h1 id="pageTitle">世界賽隊伍｜戰術模擬器</h1><p class="subtitle" id="pageSubtitle">選擇隊伍後，查看陣型、球員與招式</p></div></header>
    <section class="team-overview" aria-label="隊伍介紹與切換"><article class="team-summary"><label class="team-picker" for="teamSelect"><span>選擇隊伍</span><select id="teamSelect"></select></label><h2 class="active-team-name" id="activeTeamName" aria-live="polite">閃電日本</h2><div class="team-profile" id="teamProfile"></div><p class="team-intro" id="teamIntro"></p></article></section>
    <nav class="workspace-switcher" role="tablist" aria-label="隊伍資料分類">
      <button class="workspace-tab" type="button" role="tab" data-view="formation" aria-selected="true" aria-controls="formationPanel">陣型</button>
      <button class="workspace-tab" type="button" role="tab" data-view="players" aria-selected="false" aria-controls="playersPanel">球員</button>
      <button class="workspace-tab" type="button" role="tab" data-view="moves" aria-selected="false" aria-controls="movesPanel">招式</button>
    </nav>
    <section class="workspace-panel" id="formationPanel" data-panel="formation" role="tabpanel">
      <section class="metrics"><div class="metric"><span>目前陣型</span><strong id="mForm">通用 4-3-3</strong></div><div class="metric"><span>目前可用合體技</span><strong id="mCombo">0</strong></div></section>
      <div class="workspace">
        <section class="card"><div class="head"><div><div class="title" id="formName">通用陣型</div><div class="note">點擊球員查看資料；桌面可直接拖曳交換</div></div><div class="field-tools"><button class="btn primary" data-lineup-open="team">調整陣容</button><button class="btn" data-lineup-drag-toggle="team" aria-pressed="false">拖曳調整</button><button class="btn" id="undo" hidden>復原</button><button class="btn" id="reset">恢復預設</button><button class="btn" id="clear" hidden>清除標示</button><span class="shape" id="shape">4-3-3</span></div></div><div class="tabs" id="forms"></div><p class="formation-note" id="formationNote" hidden></p><div class="formation-tactic"><label for="formationTacticSelect"><span>必殺戰術站位</span><select id="formationTacticSelect"><option value="">選擇戰術</option></select></label><div class="tactic-board-summary" id="tacticBoardSummary">選擇後會在球場上顯示全隊站位與核心施放順序。</div><button class="btn" id="clearTactic" type="button" hidden>回到原陣型</button></div><div class="pitch-wrap"><div class="pitch"><div class="direction">↑ 進攻方向</div><div class="lines" id="lines"></div></div></div><div class="bench-wrap"><div class="section-label"><span>替補席</span><span id="benchCount"></span></div><div class="bench" id="bench"></div><div class="swapbar" id="swapbar"><span id="swaptext"></span><button class="btn" id="cancelSwap">取消</button></div></div></section>
      </div>
    </section>
    <section class="workspace-panel" id="playersPanel" data-panel="players" role="tabpanel" hidden><div id="playersPanelRoot"></div></section>
    <section class="workspace-panel card moves-panel" id="movesPanel" data-panel="moves" role="tabpanel" hidden>
      <div class="move-switcher" role="tablist" aria-label="招式分類"><button class="move-tab" type="button" role="tab" data-move-view="combo" aria-selected="true">合體必殺</button><button class="move-tab" type="button" role="tab" data-move-view="tactic" aria-selected="false">必殺戰術</button></div>
      <section data-move-panel="combo"><div class="moves-heading"><div><h2>合體必殺</h2><p>預設顯示目前可用招式，需要其他成員時可自動換人。</p></div><span class="moves-count" id="comboCount"></span></div><div class="combo-tools"><label><span class="visually-hidden">搜尋合體必殺</span><input class="combo-search" id="comboSearch" type="search" placeholder="搜尋招式或球員"></label><div class="filter"><button class="mini active" data-filter="ready">目前可用</button><button class="mini" data-filter="all">全部</button><button class="mini" data-filter="original">動畫原作</button><button class="mini" data-filter="custom">原創</button><button class="mini" data-filter="射門">射門</button><button class="mini" data-filter="進攻">進攻</button><button class="mini" data-filter="防守">防守</button></div></div><div id="combos"></div></section>
      <section data-move-panel="tactic" hidden><div class="moves-heading"><div><h2>必殺戰術</h2><p>選取後會自動補上必要球員，並回到陣型圖查看結果。</p></div><span class="moves-count" id="tacticCount"></span></div><div class="tactic-picker ready-tactics" id="rivalReadyTactics"></div><details class="tactic-details"><summary>查看全部戰術說明</summary><div class="list" id="tactics"></div></details></section>
    </section>
  </main><div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./assets/national-teams.js?v=12"></script>
  <script src="./assets/latest-opponent-teams.js?v=4"></script>
  <script src="./assets/rival-upgrade.js?v=5"></script>
  <script src="./assets/opponent-player-profiles.js?v=1"></script>
  <script src="./assets/opponent-motion-descriptions.js?v=2"></script>
  <script src="./assets/team-identity.js?v=1"></script>
  <script src="./assets/player-skills.js?v=17"></script>
  <script src="./assets/player-directory.js?v=11"></script>
  <script src="./assets/team-app.js?v=4"></script>
</body>
