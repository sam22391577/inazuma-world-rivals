  <style>

    .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{display:flex;align-items:center;gap:8px;color:var(--violet);font-size:12px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.dot{width:7px;height:7px;border-radius:99px;background:var(--violet);box-shadow:0 0 0 5px rgba(195,154,255,.1)}h1{margin:8px 0 6px;font-size:clamp(25px,4vw,42px);line-height:1.08;letter-spacing:-.035em}.subtitle{margin:0;color:var(--muted);font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--line);background:rgba(24,18,33,.82);border-radius:11px;padding:10px 14px;font-size:13px;font-weight:780;cursor:pointer;transition:.18s}.btn:hover{transform:translateY(-1px);border-color:#684e83;background:var(--panel2)}.btn.primary{background:var(--violet);border-color:var(--violet);color:#1a0d27}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{border:1px solid var(--line);background:rgba(24,18,33,.74);border-radius:14px;padding:13px 15px}.metric span{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.metric strong{font-size:18px}.workspace{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(360px,.68fr);gap:14px;align-items:start}.card{border:1px solid var(--line);background:rgba(24,18,33,.86);backdrop-filter:blur(16px);border-radius:var(--radius);box-shadow:var(--shadow)}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}.title{font-weight:880;font-size:15px}.note{color:var(--muted);font-size:11px;margin-top:3px}.shape{color:var(--violet);font-size:12px;font-weight:850;padding:6px 9px;border-radius:8px;background:var(--violet2)}
    .tabs{display:flex;gap:7px;overflow:auto;padding:13px 16px;scrollbar-width:none;border-bottom:1px solid var(--line)}.tabs::-webkit-scrollbar,.filter::-webkit-scrollbar{display:none}.pill{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 12px;color:var(--muted);font-size:12px;font-weight:780;cursor:pointer}.pill.active{background:var(--violet);border-color:var(--violet);color:#1a0d27}.formation-note{margin:0;padding:10px 16px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.65;background:rgba(195,154,255,.05)}.pitch-wrap{padding:16px}.pitch{position:relative;isolation:isolate;min-height:570px;overflow:hidden;border-radius:15px;border:1px solid rgba(226,210,255,.33);background:linear-gradient(rgba(66,23,74,.12),rgba(66,23,74,.12)),repeating-linear-gradient(90deg,#174f40 0,#174f40 12.5%,#1a5846 12.5%,#1a5846 25%)}.pitch:before{content:"";position:absolute;z-index:-1;inset:18px;border:1px solid rgba(236,255,247,.46);background:radial-gradient(circle at 50% 50%,transparent 0 54px,rgba(236,255,247,.46) 55px 56px,transparent 57px),linear-gradient(to bottom,transparent calc(50% - .5px),rgba(236,255,247,.46) 50%,transparent calc(50% + .5px))}.pitch:after{content:"";position:absolute;z-index:-1;left:50%;top:50%;width:7px;height:7px;transform:translate(-50%,-50%);border-radius:99px;background:rgba(236,255,247,.55)}.direction{position:absolute;top:25px;right:30px;font-size:10px;font-weight:800;color:rgba(236,255,247,.8)}.lines{position:absolute;inset:40px 22px;display:flex;flex-direction:column;justify-content:space-between;padding:32px 0 25px}.row{display:flex;align-items:center;justify-content:space-evenly;gap:7px;min-height:70px}.lines.custom-layout{display:block;padding:0}.lines.custom-layout .row{display:contents}.lines.custom-layout [data-lineup-team][data-player]{position:absolute;transform:translate(-50%,-50%)}.lines.custom-layout [data-lineup-team][data-player]:hover{transform:translate(-50%,calc(-50% - 2px))}.player{position:relative;width:72px;max-width:22%;border:1px solid rgba(241,228,255,.5);border-radius:10px;background:rgba(24,14,32,.9);padding:7px 4px 6px;text-align:center;cursor:pointer;box-shadow:0 7px 18px rgba(0,0,0,.27);transition:.18s}.player:hover{transform:translateY(-2px);background:#342243}.player.selected{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,122,.2),0 8px 20px rgba(0,0,0,.3)}.player.involved{background:#f0e3ff;color:#241033;border-color:#fff;box-shadow:0 0 0 4px rgba(195,154,255,.28)}.player.swap{border-color:var(--blue);box-shadow:0 0 0 3px rgba(134,198,255,.24)}.pname{display:block;font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prole{display:block;margin-top:2px;font-size:8px;letter-spacing:.08em;opacity:.64}.star{position:absolute;right:-4px;top:-5px;width:16px;height:16px;display:grid;place-items:center;border-radius:99px;background:var(--gold);color:#24140a;font-size:9px}.bench-wrap{padding:0 16px 16px}.section-label{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:750;margin-bottom:9px}.bench{display:flex;flex-wrap:wrap;gap:7px}.bench .player{width:auto;max-width:none;padding:8px 11px;background:#211829;box-shadow:none}.bench .prole{display:none}.swapbar{display:none;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:10px 12px;border:1px solid rgba(134,198,255,.38);border-radius:11px;background:rgba(49,87,127,.16);font-size:12px}.swapbar.show{display:flex}
    .side{display:grid;gap:14px}.selected-card{padding:18px}.selected-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.selected-name{font-size:22px;font-weight:900}.meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;margin-top:4px}.role{padding:5px 7px;border-radius:7px;background:var(--violet2);color:var(--violet);font-size:10px;font-weight:900}.skilltabs{display:flex;gap:4px;margin:16px 0 7px;padding:4px;background:#100b16;border-radius:10px}.skilltab{flex:1;border:0;background:transparent;border-radius:7px;padding:8px;color:var(--muted);font-size:11px;font-weight:800;cursor:pointer}.skilltab.active{background:var(--panel2);color:var(--text)}.list{display:grid;gap:2px}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(59,45,76,.75)}.line:last-child{border:0}.move-name{font-size:12px;font-weight:830}.sub{color:var(--muted);font-size:10px;margin-top:3px}.tag{display:inline-block;border-radius:6px;padding:4px 7px;font-size:9px;font-weight:900}.tag.進攻{color:#9ff0bd;background:rgba(55,160,107,.18)}.tag.防守{color:#9fceff;background:rgba(67,129,194,.2)}.tag.射門{color:#ff9d9d;background:rgba(197,63,63,.18)}.tag.搶球{color:#ffd480;background:rgba(194,132,39,.19)}
    .accordion{overflow:hidden}.accbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:transparent;padding:16px 18px;text-align:left;cursor:pointer}.acctitle{font-size:14px;font-weight:850}.accsub{font-size:10px;color:var(--muted);margin-top:4px}.counter{padding:5px 8px;border-radius:7px;background:var(--panel2);color:var(--muted);font-size:10px;font-weight:800}.chev{font-size:18px;color:var(--muted);transition:.2s}.accordion.open .chev{transform:rotate(45deg)}.accbody{display:none;padding:0 18px 16px}.accordion.open .accbody{display:block}.filter{display:flex;gap:7px;overflow:auto;margin-bottom:9px;scrollbar-width:none}.mini{flex:none;border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 9px;color:var(--muted);font-size:10px;font-weight:800;cursor:pointer}.mini.active{background:var(--panel2);color:var(--text)}.combo{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-bottom:1px solid rgba(59,45,76,.75);background:transparent;padding:11px 3px;text-align:left;cursor:pointer}.combo.chosen{background:rgba(195,154,255,.07)}.status{display:block;color:var(--muted);font-size:9px;text-align:right;margin-top:4px}.empty{padding:14px;color:var(--muted);font-size:11px;text-align:center}.toast{position:fixed;z-index:20;left:50%;bottom:max(20px,env(safe-area-inset-bottom));width:min(92vw,520px);transform:translate(-50%,18px);padding:12px 15px;border:1px solid #664f80;border-radius:12px;background:#251b30;font-size:12px;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}

<body>
  <main class="app">
    <nav class="site-nav" aria-label="網站頁面"><a class="active" href="./index.html" aria-current="page">隊伍總覽</a><a href="./match.html">兩隊對戰陣容</a></nav>
    <header class="topbar"><div><div class="eyebrow"><span class="dot"></span>Team Command</div><h1 id="pageTitle">世界賽隊伍｜戰術模擬器</h1><p class="subtitle" id="pageSubtitle">切換球隊，調整陣型並查看球員與招式</p></div><div class="actions"><button class="btn" id="undo">復原上一步</button><button class="btn" id="reset">重設陣型</button><button class="btn primary" id="clear">清除標示</button></div></header>
    <section class="team-overview" aria-label="隊伍介紹與切換"><article class="team-summary"><label class="team-picker" for="teamSelect"><span>選擇隊伍</span><select id="teamSelect"></select></label><h2 class="active-team-name" id="activeTeamName" aria-live="polite">閃電日本</h2><div class="team-profile" id="teamProfile"></div><p class="team-intro" id="teamIntro"></p></article><div class="team-directory-slot" id="teamIdentity"></div></section>
    <section class="metrics"><div class="metric"><span>目前陣型</span><strong id="mForm">通用 4-3-3</strong></div><div class="metric"><span>可用合體技</span><strong id="mCombo">0 / 66</strong></div><div class="metric"><span>可用必殺戰術</span><strong id="mTactic">0 / 12</strong></div><div class="metric"><span>場上選手</span><strong id="mSquad">11 / 18</strong></div></section>
    <div class="workspace">
      <section class="card"><div class="head"><div><div class="title" id="formName">通用陣型</div><div class="note">滑鼠直接拖拉圖卡交換 · 手機可開啟拖拉交換</div></div><div class="field-tools"><button class="btn" data-lineup-drag-toggle="team" aria-pressed="false">拖拉交換</button><button class="btn" data-lineup-open="team">多選交換</button><span class="shape" id="shape">4-3-3</span></div></div><div class="tabs" id="forms"></div><p class="formation-note" id="formationNote" hidden></p><div class="pitch-wrap"><div class="pitch"><div class="direction">↑ 進攻方向</div><div class="lines" id="lines"></div></div></div><div class="bench-wrap"><div class="section-label"><span>替補席</span><span id="benchCount"></span></div><div class="bench" id="bench"></div><div class="swapbar" id="swapbar"><span id="swaptext"></span><button class="btn" id="cancelSwap">取消</button></div><div class="ready-tactics" id="rivalReadyTactics"></div></div></section>
      <aside class="side">
        <section class="card selected-card" hidden><div class="selected-top"><div><div class="selected-name" id="selectedName"></div><div class="meta"><span class="role" id="selectedRole"></span><span id="selectedStatus"></span></div></div><button class="btn primary" id="swap">多選交換</button></div><div class="skilltabs"><button class="skilltab active" data-st="solo">個人必殺技</button><button class="skilltab" data-st="combo">目前可用合體技</button></div><div class="list" id="skills"></div></section>
        <section class="card accordion" id="tacticPanel"><button class="accbtn" type="button" aria-expanded="false"><span><span class="acctitle">全隊必殺戰術</span><span class="accsub">完整說明 · 顯示目前可用狀態</span></span><span style="display:flex;align-items:center;gap:8px"><span class="counter" id="tacticCount"></span><span class="chev">＋</span></span></button><div class="accbody"><div class="list" id="tactics"></div></div></section>
        <section class="card accordion open"><button class="accbtn" type="button" aria-expanded="true"><span><span class="acctitle">全隊合體必殺</span><span class="accsub">點選招式自動排陣並標示成員</span></span><span style="display:flex;align-items:center;gap:8px"><span class="counter" id="comboCount"></span><span class="chev">＋</span></span></button><div class="accbody"><div class="filter"><button class="mini active" data-filter="all">全部</button><button class="mini" data-filter="ready">目前可用</button><button class="mini" data-filter="original">原作合體</button><button class="mini" data-filter="custom">原創合體</button><button class="mini" data-filter="射門">射門</button><button class="mini" data-filter="進攻">進攻</button><button class="mini" data-filter="防守">防守</button></div><div id="combos"></div></div></section>
        <section class="card canon-reference"><details><summary>合體技圖鑑（原作／延伸）</summary><p class="reference-note">外隊搭檔由本隊同位置球員隨機搭配，配對結果會保存；招式統一顯示目前搭配的本隊成員。圓堂晴另列遊戲劇情搭配。</p><div id="canonGuide"></div></details></section>
      </aside>
    </div>
  </main><div class="toast" id="toast" role="status" aria-live="polite"></div>
