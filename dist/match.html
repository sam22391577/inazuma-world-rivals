<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#091514">
  <meta name="description" content="兩隊相向進攻的完整球場，支援多選交換、滑鼠與觸控拖拉調整陣容。">
  <title>對戰模擬｜閃電十一人世界賽</title>
  <link rel="stylesheet" href="./assets/match.css?v=10">
  <link rel="stylesheet" href="./assets/player-portraits.css?v=2">
  <link rel="stylesheet" href="./assets/lineup-tools.css?v=4">
  <link rel="stylesheet" href="./assets/swap-drawer.css?v=1">
  <link rel="stylesheet" href="./assets/technique-info.css?v=8">
  <link rel="stylesheet" href="./assets/player-skills.css?v=8">
  <link rel="stylesheet" href="./assets/player-directory.css?v=11">
  <link rel="stylesheet" href="./assets/team-identity.css?v=1">
</head>
<body>
  <main class="app">
    <nav class="site-nav" aria-label="網站頁面"><a href="./index.html">隊伍資料</a><a class="active" href="./match.html">對戰模擬</a></nav>
    <header class="match-header"><div><div class="eyebrow">Match Lineup</div><h1>對戰模擬</h1><p>選擇雙方隊伍，調整陣型與先發名單</p></div><div class="header-actions"><button class="btn" id="matchUndo" hidden disabled>復原</button><button class="btn" id="flipEnds">交換場地</button></div></header>
    <section class="match-setup" aria-label="選擇對戰隊伍與隊伍分析">
      <article class="setup-card team-a-setup">
        <div class="setup-heading"><div><span>左側隊伍</span><h2 id="aSetupTitle">閃電日本</h2></div><label class="team-select" for="aTeamSelect"><span>選擇隊伍</span><select id="aTeamSelect"></select></label></div>
        <div class="team-profile" id="aSetupProfile"></div><p class="team-intro" id="aTeamIntro"></p>
      </article>
      <article class="setup-card team-b-setup">
        <div class="setup-heading"><div><span>右側隊伍</span><h2 id="bSetupTitle">世界聯合選拔隊</h2></div><label class="team-select" for="bTeamSelect"><span>選擇隊伍</span><select id="bTeamSelect"></select></label></div>
        <div class="team-profile" id="bSetupProfile"></div><p class="team-intro" id="bTeamIntro"></p>
      </article>
    </section>
    <div class="direction-strip"><span class="team-a" id="aAttack">世界代表隊 ↑</span><span class="versus">VS</span><span class="team-b" id="bAttack">世界聯合選拔隊 ↓</span></div>
    <div class="match-layout">
      <section class="field-card" aria-label="兩隊實際進攻方向與站位">
        <div class="field-heading"><strong>比賽站位</strong><span>點擊球員查看資料；桌面可直接拖曳交換</span></div>
        <div class="match-pitch" id="matchPitch">
          <div class="touchline"></div><div class="halfway"></div><div class="center-circle"></div>
          <div class="penalty top"></div><div class="penalty bottom"></div><div class="goal top"></div><div class="goal bottom"></div>
          <span class="pitch-direction top" id="topTeam"></span><span class="pitch-direction bottom" id="bottomTeam"></span>
          <div class="team-layer" id="aLines" aria-label="世界代表隊場上11人"></div>
          <div class="team-layer" id="bLines" aria-label="世界聯合選拔隊場上11人"></div>
        </div>
      </section>
      <aside class="match-controls">
        <section class="team-card team-a-card">
          <div class="team-card-head"><div><h2 id="aTeamTitle">世界代表隊</h2><span id="aName"></span></div><strong id="aShape"></strong></div>
          <div class="formation-tabs" id="aTabs" aria-label="世界代表隊陣型"></div>
          <p class="formation-note" id="aFormationNote" hidden></p>
          <div class="team-actions"><button class="btn primary" id="aSwap">調整陣容</button><button class="btn" data-lineup-drag-toggle="match-a" aria-pressed="false">拖曳調整</button><button class="btn" id="aReset">恢復預設</button></div>
          <p class="selection-info" id="aSelected"></p><div class="ready-count" id="aReady"></div>
          <div class="bench-heading"><strong>替補席</strong><span id="aCount"></span></div><div class="match-bench" id="aBench"></div>
          <div class="ready-tactics" id="aReadyTactics"></div>
        </section>
        <section class="team-card team-b-card">
          <div class="team-card-head"><div><h2 id="bTeamTitle">世界聯合選拔隊</h2><span id="bName"></span></div><strong id="bShape"></strong></div>
          <div class="formation-tabs" id="bTabs" aria-label="世界聯合選拔隊陣型"></div>
          <p class="formation-note" id="bFormationNote" hidden></p>
          <div class="team-actions"><button class="btn primary" id="bSwap">調整陣容</button><button class="btn" data-lineup-drag-toggle="match-b" aria-pressed="false">拖曳調整</button><button class="btn" id="bReset">恢復預設</button></div>
          <p class="selection-info" id="bSelected"></p><div class="ready-count" id="bReady"></div>
          <div class="bench-heading"><strong>替補席</strong><span id="bCount"></span></div><div class="match-bench" id="bBench"></div>
          <div class="ready-tactics" id="bReadyTactics"></div>
        </section>
        <details class="help-card"><summary>操作說明</summary><p>點擊球員可查看資料；「調整陣容」能一次交換多人；桌面可直接拖曳，手機需先開啟「拖曳調整」。</p></details>
      </aside>
    </div>
    <section class="matchups"><h2>主要對位焦點</h2><div class="duels" id="duels"></div></section>
  </main>
  <div class="match-toast" id="matchToast" role="status" aria-live="polite"></div>
  <script src="./assets/player-portraits.js?v=6"></script>
  <script src="./assets/lineup-tools.js?v=10"></script>
  <script src="./assets/swap-drawer.js?v=2"></script>
  <script src="./assets/technique-info.js?v=11"></script>
  <script src="./assets/canon-skills.js?v=10"></script>
  <script src="./assets/canon-combos.js?v=21"></script>
  <script src="./assets/player-skills.js?v=17"></script>
  <script src="./assets/teams-data.js?v=29"></script>
  <script src="./assets/national-teams.js?v=14"></script>
  <script src="./assets/latest-opponent-teams.js?v=4"></script>
  <script src="./assets/rival-upgrade.js?v=8"></script>
  <script src="./assets/opponent-player-profiles.js?v=1"></script>
  <script src="./assets/player-directory.js?v=11"></script>
  <script src="./assets/opponent-motion-descriptions.js?v=2"></script>
  <script src="./assets/team-identity.js?v=1"></script>
  <script src="./assets/match-app.js?v=24"></script>
</body>
</html>
